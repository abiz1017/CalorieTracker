<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Fuel</title><link rel="stylesheet" href="/styles.css"><link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><main><header><div><p class="eyebrow">CALORIE TRACKER</p><h1>Daily Fuel</h1><p id="date"></p></div><button id="refresh">Refresh</button></header>
<section class="hero card"><div><span>Calories</span><strong id="calories">—</strong><small id="calRemain">— remaining</small></div><div id="macroCards" class="macros"></div></section>
<div class="grid"><section class="card"><div class="section-title"><h2>Today</h2><span id="mealCount"></span></div><div id="meals"></div><form id="mealForm"><input name="name" placeholder="Meal" required><input name="calories" type="number" placeholder="kcal" required><input name="protein" type="number" placeholder="protein"><input name="carbs" type="number" placeholder="carbs"><input name="fat" type="number" placeholder="fat"><button>Add</button></form></section>
<section class="card"><div class="section-title"><h2>Eat nearby</h2><span>ChatGPT suggestions</span></div><div id="map"></div><div id="spots"></div></section>
<section class="card groceries"><div class="section-title"><h2>Cook instead</h2><span>Grocery list</span></div><div id="groceries"></div></section></div>
<footer>ChatGPT MCP endpoint: <code>/mcp</code></footer></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script></body></html>
